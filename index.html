<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purposeless Modernity</title>
<style>
:root{
  --p:28px;
  --s:26px;
  --edge:16px;
  --text:#c7bfae;
  --bright:#f2ead9;
  --muted:#7e7565;
  --line:#282117;
  --rule:#332b1f;
  --accent:#b9a887;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}

*,::before,::after{box-sizing:border-box}

body{
  margin:0;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:var(--edge);
  background-color:#0b0a08;
  background-image:radial-gradient(140% 110% at 50% -10%,#1a1611 0%,#0d0b09 50%,#070605 100%);
  color:var(--text);
  font:17px/1.75 var(--serif);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

main{
  width:min(1400px,100%);
  height:calc(100dvh - var(--edge) * 2);
  display:flex;
  flex-direction:column;
  gap:14px;
}

.sheet{
  position:relative;
  z-index:0;
  flex:1;
  min-height:0;
  padding:var(--p);
  background-image:linear-gradient(90deg,
    rgba(0,0,0,0) calc(50% - 34px),
    rgba(0,0,0,.45) calc(50% - 12px),
    rgba(0,0,0,.85) 50%,
    rgba(0,0,0,.45) calc(50% + 12px),
    rgba(0,0,0,0) calc(50% + 34px));
}

.sheet::before,
.sheet::after{
  content:"";
  position:absolute;
  z-index:-1;
  top:0;
  bottom:0;
  width:calc(50% - var(--s) / 2);
  border:1px solid var(--line);
  border-radius:2px;
  background-image:linear-gradient(180deg,#1d1913 0%,#151310 45%,#100e0c 100%);
}

.sheet::before{
  left:0;
  box-shadow:inset -26px 0 30px -26px rgba(0,0,0,.95), 0 24px 46px -28px rgba(0,0,0,.95);
}

.sheet::after{
  right:0;
  box-shadow:inset 26px 0 30px -26px rgba(0,0,0,.95), 0 24px 46px -28px rgba(0,0,0,.95);
}

#view{height:100%;overflow:hidden}

#book{
  height:100%;
  column-count:2;
  column-gap:calc(var(--p) * 2 + var(--s));
  column-fill:auto;
  hyphens:auto;
  text-align:justify;
}

#book > h1:first-child{break-before:auto}

#book h1{
  break-before:column;
  margin:0 0 30px;
  font:600 27px/1.25 var(--serif);
  letter-spacing:.005em;
  color:var(--bright);
}

#book h1::after{
  content:"";
  display:block;
  width:46px;
  height:1px;
  margin-top:17px;
  background:var(--rule);
}

#book h2,
#book h3{
  margin:26px 0 10px;
  font:600 17px/1.4 var(--mono);
  letter-spacing:.06em;
  color:var(--bright);
}

#book h1,
#book h2,
#book h3{break-after:avoid}

#book p{margin:0 0 .85em}
#book p + p{text-indent:1.5em}

#book hr{
  width:56px;
  margin:30px auto;
  border:0;
  border-top:1px solid var(--rule);
}

#book blockquote{
  margin:0 0 1em;
  padding:2px 0 2px 20px;
  border-left:1px solid var(--rule);
  color:var(--muted);
  font-style:italic;
}

nav{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:22px;
  font:11px/1 var(--mono);
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}

#prev{justify-self:end}
#next{justify-self:start}

button{
  appearance:none;
  padding:10px 14px;
  border:1px solid transparent;
  border-radius:2px;
  background:transparent;
  color:inherit;
  font:inherit;
  letter-spacing:inherit;
  text-transform:inherit;
  cursor:pointer;
  transition:color .2s ease,border-color .2s ease,background-color .2s ease;
}

button:hover:not(:disabled){
  color:var(--bright);
  border-color:var(--rule);
  background-color:rgba(255,255,255,.025);
}

button:disabled{opacity:.28;cursor:default}

.folio{
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
}

input{
  width:66px;
  height:28px;
  padding:0 6px;
  border:0;
  border-bottom:1px solid var(--rule);
  border-radius:0;
  background:transparent;
  color:var(--bright);
  font:inherit;
  letter-spacing:.12em;
  text-align:center;
  transition:border-color .2s ease;
}

input:hover{border-bottom-color:#4a3f2e}
input:focus{border-bottom-color:var(--accent)}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

::selection{background:#4a3f2e;color:var(--bright)}

@media (max-width:900px){
  :root{--p:20px;--s:20px}
}

@media (max-width:700px){
  :root{--edge:12px;--p:18px;--s:18px}
  #book{column-count:1}
  .sheet{background-image:none}
  .sheet::before{width:100%;box-shadow:0 22px 42px -26px rgba(0,0,0,.95)}
  .sheet::after{display:none}
  nav{gap:8px;letter-spacing:.1em}
  .folio{gap:7px}
  button{padding:10px 8px}
  input{width:58px;font-size:16px}
}
</style>
</head>
<body>
<main>
<div class="sheet"><div id="view"><div id="book"></div></div></div>
<nav>
<button id="prev">Previous</button>
<label class="folio">Page <input id="go" inputmode="numeric"> <span>of <span id="total"></span></span></label>
<button id="next">Next</button>
</nav>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const book = $('book'), go = $('go');
let page = +(document.cookie.match(/bookpage=(\d+)/)?.[1] || 1), pages = 1, cols = 2, x0 = 0;

const gap = () => parseFloat(getComputedStyle(book).columnGap);
const inline = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
const block = b => {
  const h = b.match(/^(#{1,3}) (.*)/);
  if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
  if (/^[-*_]{3,}$/.test(b)) return '<hr>';
  if (b[0] === '>') return `<blockquote>${inline(b.replace(/^> ?/gm, ''))}</blockquote>`;
  return `<p>${inline(b)}</p>`;
};

const show = p => {
  page = Math.min(Math.max(p, 1), pages);
  const spread = Math.floor((page - 1) / cols);
  page = spread * cols + 1;
  book.style.transform = `translateX(${-Math.round(spread * (book.clientWidth + gap()))}px)`;
  go.value = cols > 1 && page < pages ? `${page}–${page + 1}` : page;
  $('prev').disabled = page <= 1;
  $('next').disabled = page + cols > pages;
  document.cookie = `bookpage=${page};max-age=31536000;path=/;SameSite=Lax`;
};

const measure = () => {
  cols = +getComputedStyle(book).columnCount;
  const g = gap(), colWidth = (book.clientWidth - g * (cols - 1)) / cols;
  pages = Math.max(1, Math.round((book.scrollWidth + g) / (colWidth + g)));
  $('total').textContent = pages;
  show(page);
};

$('prev').onclick = () => show(page - cols);
$('next').onclick = () => show(page + cols);
go.onfocus = () => go.select();
go.onchange = () => show(parseInt(go.value) || page);
window.onresize = measure;
window.onkeydown = e => {
  if (e.target === go) return;
  if (e.key === 'ArrowRight') show(page + cols);
  if (e.key === 'ArrowLeft') show(page - cols);
};
window.ontouchstart = e => x0 = e.touches[0].clientX;
window.ontouchend = e => {
  const d = e.changedTouches[0].clientX - x0;
  if (Math.abs(d) > 50) show(page + (d < 0 ? cols : -cols));
};

const md = await fetch('book.md').then(r => r.ok ? r.text() : 'Add a book.md file next to index.html.');
book.innerHTML = md.replace(/\r/g, '').replace(/^(#{1,3} .*|[-*_]{3,})$/gm, '\n$1\n').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(block).join('');
await document.fonts.ready;
measure();
</script>
</body>
</html>
