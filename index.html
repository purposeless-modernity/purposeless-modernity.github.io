<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purposeless Modernity</title>
<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--line:#2e2e2e;--text:#cfcfcf;--bright:#f2f2f2;--muted:#8a8a8a;--p:24px;--s:24px}
*,::before,::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--text);font:15px/1.8 system-ui,sans-serif}
main{width:min(1400px,100%);display:flex;flex-direction:column;gap:16px}
.sheet{position:relative;z-index:0;padding:var(--p)}
.sheet::before,.sheet::after{content:"";position:absolute;z-index:-1;top:0;bottom:0;width:calc(50% - var(--s) / 2);background:var(--surface);border:1px solid var(--line);border-radius:2px}
.sheet::before{left:0}
.sheet::after{right:0}
#view{height:calc(100dvh - 130px);min-height:240px;overflow:hidden}
#book{height:100%;column-count:2;column-gap:calc(var(--p) * 2 + var(--s));column-fill:auto}
h1{break-before:column;margin:0 0 24px;font-size:22px;line-height:1.3;font-weight:600;color:var(--bright)}
h2,h3{margin:24px 0 8px;font-size:17px;line-height:1.4;color:var(--bright)}
h1,h2,h3{break-after:avoid}
p{margin:0 0 12px}
hr{margin:24px 0;border:0;border-top:1px solid var(--line)}
blockquote{margin:0 0 12px;padding-left:16px;border-left:2px solid var(--line);color:var(--muted)}
nav{display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;color:var(--muted)}
button,input{height:32px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--text);font:inherit;transition:background-color .15s}
button{padding:0 16px;cursor:pointer}
button:hover:not(:disabled){background:#262626}
button:disabled{opacity:.35;cursor:default}
input{width:64px;margin:0 8px;text-align:center}
:focus-visible{outline:2px solid #d4d4d4;outline-offset:2px}
@media(max-width:900px){:root{--p:16px;--s:16px}}
@media(max-width:700px){body{padding:12px}#view{height:calc(100dvh - 110px)}#book{column-count:1}.sheet::before{width:100%}.sheet::after{display:none}input{font-size:16px}nav{gap:8px}}
</style>
</head>
<body>
<main>
<div class="sheet"><div id="view"><div id="book"></div></div></div>
<nav>
<button id="prev">Previous</button>
<label>Page <input id="go" inputmode="numeric"> of <span id="total"></span></label>
<button id="next">Next</button>
</nav>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const book = $('book'), go = $('go');
let page = +(document.cookie.match(/bookpage=(\d+)/)?.[1] || 1), pages = 1, cols = 2, x0 = 0;

const gap = () => parseFloat(getComputedStyle(book).columnGap);
const inline = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
const block = b => {
  const h = b.match(/^(#{1,3}) (.*)/);
  if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
  if (/^[-*_]{3,}$/.test(b)) return '<hr>';
  if (b[0] === '>') return `<blockquote>${inline(b.replace(/^> ?/gm, ''))}</blockquote>`;
  return `<p>${inline(b)}</p>`;
};

const show = p => {
  page = Math.min(Math.max(p, 1), pages);
  const spread = Math.floor((page - 1) / cols);
  page = spread * cols + 1;
  book.style.transform = `translateX(${-Math.round(spread * (book.clientWidth + gap()))}px)`;
  go.value = cols > 1 && page < pages ? `${page}–${page + 1}` : page;
  $('prev').disabled = page <= 1;
  $('next').disabled = page + cols > pages;
  document.cookie = `bookpage=${page};max-age=31536000;path=/;SameSite=Lax`;
};

const measure = () => {
  cols = +getComputedStyle(book).columnCount;
  const g = gap(), colWidth = (book.clientWidth - g * (cols - 1)) / cols;
  pages = Math.max(1, Math.round((book.scrollWidth + g) / (colWidth + g)));
  $('total').textContent = pages;
  show(page);
};

$('prev').onclick = () => show(page - cols);
$('next').onclick = () => show(page + cols);
go.onfocus = () => go.select();
go.onchange = () => show(parseInt(go.value) || page);
window.onresize = measure;
window.onkeydown = e => {
  if (e.target === go) return;
  if (e.key === 'ArrowRight') show(page + cols);
  if (e.key === 'ArrowLeft') show(page - cols);
};
window.ontouchstart = e => x0 = e.touches[0].clientX;
window.ontouchend = e => {
  const d = e.changedTouches[0].clientX - x0;
  if (Math.abs(d) > 50) show(page + (d < 0 ? cols : -cols));
};

const md = await fetch('book.md').then(r => r.ok ? r.text() : 'Add a book.md file next to index.html.');
book.innerHTML = md.replace(/\r/g, '').replace(/^(#{1,3} .*|[-*_]{3,})$/gm, '\n$1\n').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(block).join('');
await document.fonts.ready;
measure();
</script>
</body>
</html>
