<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purposeless Modernity</title>
<style>
:root{
  --p:28px;
  --s:26px;
  --edge:16px;
  --bg:#000000;
  --surface:#111111;
  --line:#222222;
  --text:#cccccc;
  --bright:#ffffff;
  --muted:#777777;
  --font-main:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --font-ui:system-ui,-apple-system,sans-serif;
}

*,::before,::after{box-sizing:border-box}

body{
  margin:0;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:var(--edge);
  background-color:var(--bg);
  color:var(--text);
  font:17px/1.75 var(--font-main);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

main{
  width:min(1400px,100%);
  height:calc(100dvh - var(--edge) * 2);
  display:flex;
  flex-direction:column;
  gap:16px;
}

.sheet{
  position:relative;
  z-index:0;
  flex:1;
  min-height:0;
  padding:var(--p);
}

.sheet::before,
.sheet::after{
  content:"";
  position:absolute;
  z-index:-1;
  top:0;
  bottom:0;
  width:calc(50% - var(--s) / 2);
  background-color:var(--surface);
  border:1px solid var(--line);
}

.sheet::before{
  left:0;
  border-right:none;
}

.sheet::after{
  right:0;
  border-left:none;
}

#view{height:100%;overflow:hidden}

#book{
  height:100%;
  column-count:2;
  column-gap:calc(var(--p) * 2 + var(--s));
  column-fill:auto;
  hyphens:auto;
  text-align:justify;
}

#book > h1:first-child{break-before:auto}

#book h1{
  break-before:column;
  margin:0 0 30px;
  font:600 26px/1.3 var(--font-main);
  letter-spacing:-0.01em;
  color:var(--bright);
}

#book h1::after{
  content:"";
  display:block;
  width:40px;
  height:1px;
  margin-top:16px;
  background:var(--line);
}

#book h2,
#book h3{
  margin:26px 0 10px;
  font:600 17px/1.4 var(--font-ui);
  color:var(--bright);
}

#book h1,
#book h2,
#book h3{break-after:avoid}

#book p{margin:0 0 .85em}
#book p + p{text-indent:1.5em}

#book hr{
  width:50px;
  margin:30px auto;
  border:0;
  border-top:1px solid var(--line);
}

#book blockquote{
  margin:0 0 1em;
  padding:2px 0 2px 20px;
  border-left:1px solid var(--line);
  color:var(--muted);
  font-style:italic;
}

nav{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:20px;
  font:13px/1 var(--font-ui);
  letter-spacing:0.02em;
  color:var(--muted);
}

#prev{justify-self:end}
#next{justify-self:start}

button{
  appearance:none;
  padding:8px 12px;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:inherit;
  font:inherit;
  cursor:pointer;
  transition:color .2s ease,background-color .2s ease;
}

button:hover:not(:disabled){
  color:var(--bright);
  background-color:#1a1a1a;
}

button:disabled{opacity:.3;cursor:default}

.folio{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}

input{
  width:52px;
  height:26px;
  padding:0 4px;
  border:1px solid var(--line);
  border-radius:4px;
  background:transparent;
  color:var(--bright);
  font:inherit;
  text-align:center;
  transition:border-color .2s ease;
}

input:hover{border-color:#444}
input:focus{outline:none;border-color:var(--muted)}

:focus-visible{outline:2px solid var(--muted);outline-offset:2px}

::selection{background:#333;color:#fff}

@media (max-width:900px){
  :root{--p:20px;--s:20px}
}

@media (max-width:700px){
  :root{--edge:12px;--p:18px;--s:18px}
  #book{column-count:1}
  .sheet::before{width:100%;border-right:1px solid var(--line)}
  .sheet::after{display:none}
  nav{gap:10px}
  .folio{gap:6px}
  button{padding:8px 6px}
  input{width:48px;font-size:16px}
}
</style>
</head>
<body>
<main>
<div class="sheet"><div id="view"><div id="book"></div></div></div>
<nav>
<button id="prev">Previous</button>
<label class="folio">Page <input id="go" inputmode="numeric"> <span>of <span id="total"></span></span></label>
<button id="next">Next</button>
</nav>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const book = $('book'), go = $('go');
let page = +(document.cookie.match(/bookpage=(\d+)/)?.[1] || 1), pages = 1, cols = 2, x0 = 0;

const gap = () => parseFloat(getComputedStyle(book).columnGap);
const inline = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
const block = b => {
  const h = b.match(/^(#{1,3}) (.*)/);
  if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
  if (/^[-*_]{3,}$/.test(b)) return '<hr>';
  if (b[0] === '>') return `<blockquote>${inline(b.replace(/^> ?/gm, ''))}</blockquote>`;
  return `<p>${inline(b)}</p>`;
};

const show = p => {
  page = Math.min(Math.max(p, 1), pages);
  const spread = Math.floor((page - 1) / cols);
  page = spread * cols + 1;
  book.style.transform = `translateX(${-Math.round(spread * (book.clientWidth + gap()))}px)`;
  go.value = cols > 1 && page < pages ? `${page}–${page + 1}` : page;
  $('prev').disabled = page <= 1;
  $('next').disabled = page + cols > pages;
  document.cookie = `bookpage=${page};max-age=31536000;path=/;SameSite=Lax`;
};

const measure = () => {
  cols = +getComputedStyle(book).columnCount;
  const g = gap(), colWidth = (book.clientWidth - g * (cols - 1)) / cols;
  pages = Math.max(1, Math.round((book.scrollWidth + g) / (colWidth + g)));
  $('total').textContent = pages;
  show(page);
};

$('prev').onclick = () => show(page - cols);
$('next').onclick = () => show(page + cols);
go.onfocus = () => go.select();
go.onchange = () => show(parseInt(go.value) || page);
window.onresize = measure;
window.onkeydown = e => {
  if (e.target === go) return;
  if (e.key === 'ArrowRight') show(page + cols);
  if (e.key === 'ArrowLeft') show(page - cols);
};
window.ontouchstart = e => x0 = e.touches[0].clientX;
window.ontouchend = e => {
  const d = e.changedTouches[0].clientX - x0;
  if (Math.abs(d) > 50) show(page + (d < 0 ? cols : -cols));
};

const md = await fetch('book.md').then(r => r.ok ? r.text() : 'Add a book.md file next to index.html.');
book.innerHTML = md.replace(/\r/g, '').replace(/^(#{1,3} .*|[-*_]{3,})$/gm, '\n$1\n').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(block).join('');
await document.fonts.ready;
measure();
</script>
</body>
</html>
